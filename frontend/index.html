<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gophenberg</title>
    <style>
      .gophenberg-boot {
        display: flex;
        flex-direction: column;
        gap: 24px;
        max-width: 480px;
        padding: 32px;
        opacity: 0;
        animation: gophenberg-boot-in 200ms cubic-bezier(0.4, 0, 0.2, 1) 150ms
          forwards;
      }

      .gophenberg-boot__bar {
        height: 14px;
        border-radius: 2px;
        background: #f4f4f4;
      }

      .gophenberg-boot__bar--title {
        height: 32px;
        width: 40%;
      }

      .gophenberg-boot__bar--last {
        width: 70%;
      }

      @keyframes gophenberg-boot-in {
        100% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="gophenberg-boot" aria-hidden="true">
        <div class="gophenberg-boot__bar gophenberg-boot__bar--title"></div>
        <div class="gophenberg-boot__bar"></div>
        <div class="gophenberg-boot__bar"></div>
        <div class="gophenberg-boot__bar gophenberg-boot__bar--last"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
