reviews:
  path_instructions:
    - path: "**/*.go"
      instructions: >-
        The only comment this repository allows is a docblock directly above a declaration. A
        docblock starts with the name of what it documents, and states WHAT that thing does and
        never how or why. Do not ask for inline comments, TODO markers, or section markers.
    - path: "**/*_test.go"
      instructions: >-
        Test functions here deliberately carry no doc comment. Their name states what they verify
        and every one of them follows that convention, so never ask for a doc comment on a
        function whose name begins with Test, Benchmark or Fuzz. Helper functions and methods in
        test files do carry a one line docblock, so a missing one there is worth reporting.
    - path: "**/*.{ts,tsx}"
      instructions: >-
        Every comment sits directly above the declaration it documents and states WHAT it does,
        never how or why. Functions carry TSDoc with @param and @returns where they apply. In
        test files the test callbacks carry no comment, since the test title already says what is
        verified, so ask only about helper functions there. Do not ask for inline comments or
        TODO markers.
    - path: "**/*.sql"
      instructions: >-
        Migrations carry only the goose directive comments they need and one SPDX line. Never ask
        for any other comment to be added to a migration.
    - path: "**/*.json"
      instructions: >-
        JSON has no comment syntax, so never ask for an SPDX or license header in a JSON file.
        The translation catalogues under languages directories are generated by scripts and never
        edited by hand. The package manifests that publish to npm already carry the license
        field, and the private workspace manifests deliberately carry none, since the repository
        LICENSE file governs them.
    - path: "languages/*"
      instructions: >-
        Machine written translations are committed flagged fuzzy on purpose and they ship that
        way in the runtime catalogues. Translators clear the flag after review, so never ask for
        a fuzzy entry to be removed, emptied or withheld from the build. The template and the
        catalogues keep their machine written gettext headers and take no license header.
code_generation:
  docstrings:
    path_instructions:
      - path: "**/*_test.go"
        instructions: >-
          Never generate a docstring for a function whose name begins with Test, Benchmark or
          Fuzz. Helpers take a single line starting with the function name.
      - path: "**/*.test.{ts,tsx}"
        instructions: >-
          Never generate a comment on a test callback. Helper functions take a TSDoc block
          stating what the helper does.
