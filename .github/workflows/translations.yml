name: translations

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: translations
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make translations
        env:
          POEDITOR_API_TOKEN: ${{ secrets.POEDITOR_API_TOKEN }}
          POEDITOR_PROJECT_ID: ${{ secrets.POEDITOR_PROJECT_ID }}
      - run: make catalogs
      - id: moved
        run: echo "any=$(git status --porcelain languages frontend/src/languages internal/i18n/catalogs | head -c1)" >> "$GITHUB_OUTPUT"
      - if: steps.moved.outputs.any != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: translations/batch
          title: "chore(i18n): carry the translations that arrived"
          body: |
            The translation platform exported new work since the last batch.

            Every catalogue here was compiled from its source, so the
            byte comparison gate proves the shipped files match.
          commit-message: "chore(i18n): carry the translations that arrived"
          delete-branch: true
