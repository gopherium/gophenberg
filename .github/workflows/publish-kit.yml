name: publish-kit

on:
  push:
    tags: ["astro@*"]

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/astro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Verify the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#astro@}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag $tag_version does not match package.json version $pkg_version" >&2
            exit 1
          fi
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}
      - run: pnpm run cover
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: sdk/astro/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Update npm for trusted publishing
        run: npm install -g npm@11.19.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: npm publish ./*.tgz --loglevel verbose
