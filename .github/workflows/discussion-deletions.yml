name: discussion-deletions

on:
  discussion:
    types: [deleted]
  discussion_comment:
    types: [deleted]

permissions: {}

jobs:
  discord:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post the deleted text to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          jq --arg event "$GITHUB_EVENT_NAME" '
            (if $event == "discussion_comment" then .comment else .discussion end) as $item
            | (if $event == "discussion_comment" then "Comment deleted in: " else "Discussion deleted: " end) as $prefix
            | {
                allowed_mentions: {parse: []},
                embeds: [{
                  title: (($prefix + .discussion.title)[0:256]),
                  url: .discussion.html_url,
                  description: (if ($item.body // "") == "" then "(empty)" else $item.body[0:4000] end),
                  fields: [
                    {name: "Written by", value: $item.user.login, inline: true},
                    {name: "Deleted by", value: .sender.login, inline: true},
                    {name: "Repository", value: .repository.full_name, inline: true}
                  ]
                }]
              }' "$GITHUB_EVENT_PATH" > message.json
          curl --fail --silent --show-error -H 'Content-Type: application/json' --data @message.json "$DISCORD_WEBHOOK_URL"
