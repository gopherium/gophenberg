name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the embedded version matches the tag
        run: |
          embedded="$(cat internal/version/VERSION)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$embedded" != "$tagged" ]; then
            echo "internal/version/VERSION is $embedded but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: make release-archives RELEASE_STAMP=official RELEASE_COMMIT="$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  sign:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build releasetool from the standard library alone
        run: |
          GOMODCACHE="$RUNNER_TEMP/empty-module-cache" GOPROXY=off GOFLAGS=-mod=readonly GOWORK=off \
            go build -o "$RUNNER_TEMP/releasetool" ./cmd/releasetool
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archives
          path: dist
      - name: Sign the archives, write the record and SHA256SUMS, and check every signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_KEY_MULTIKEY: ${{ vars.RELEASE_KEY_MULTIKEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ] || [ -z "$RELEASE_KEY_MULTIKEY" ]; then
            echo "the release environment holds no RELEASE_SIGNING_KEY, or the repository no RELEASE_KEY_MULTIKEY" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          record="gophenberg_${version}_release-record.json"
          tool="$RUNNER_TEMP/releasetool"
          key="$RUNNER_TEMP/release.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release.pub.pem"
          cd dist
          "$tool" sign -key "$key" gophenberg_*.tar.gz
          "$tool" record -version "$version" \
            -download-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            gophenberg_*.tar.gz > "$record"
          "$tool" sign -key "$key" "$record"
          "$tool" sums gophenberg_*.tar.gz "$record" > SHA256SUMS
          "$tool" sign -key "$key" SHA256SUMS
          "$tool" verify -public "$RELEASE_KEY_MULTIKEY" gophenberg_*.tar.gz "$record" SHA256SUMS
      - name: Check every archive with OpenSSL alone
        working-directory: dist
        run: |
          for archive in gophenberg_*.tar.gz; do
            printf '%s==' "$(tr '_-' '/+' < "$archive.sig" | tr -d '\n')" | openssl base64 -d -A > "$RUNNER_TEMP/sig.bin"
            openssl dgst -sha384 -binary "$archive" > "$RUNNER_TEMP/digest.bin"
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release.pub.pem" -rawin \
              -in "$RUNNER_TEMP/digest.bin" -sigfile "$RUNNER_TEMP/sig.bin"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attest:
    if: github.event_name == 'push'
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  image-check:
    if: github.event_name == 'push'
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed
          path: dist
      - name: Unpack the linux binaries from their signed archives
        run: |
          for arch in amd64 arm64; do
            mkdir -p "dist/linux_$arch"
            tar -xzf "dist/gophenberg_${GITHUB_REF_NAME#v}_linux_$arch.tar.gz" -C "dist/linux_$arch" gophenberg
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          build-contexts: binaries=./dist
          platforms: linux/amd64
          load: true
          push: false
          tags: gophenberg:release-check
      - name: The image answers as this official release and holds the archive's binary
        run: |
          about="$(docker run --rm gophenberg:release-check about -json)"
          if [ "$(printf '%s' "$about" | jq -r .version)" != "${GITHUB_REF_NAME#v}" ] ||
            [ "$(printf '%s' "$about" | jq -r .stamp)" != official ]; then
            echo "the image answers $about" >&2
            exit 1
          fi
          container="$(docker create gophenberg:release-check)"
          docker cp "$container:/gophenberg" "$RUNNER_TEMP/image-binary"
          docker rm "$container"
          image="$(sha256sum < "$RUNNER_TEMP/image-binary")"
          archived="$(sha256sum < dist/linux_amd64/gophenberg)"
          if [ "$image" != "$archived" ]; then
            echo "the image holds another binary than the signed archive" >&2
            exit 1
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          build-contexts: binaries=./dist
          platforms: linux/arm64
          push: false
          outputs: type=local,dest=${{ runner.temp }}/image-arm64
      - name: The linux/arm64 image holds the signed archive's binary
        run: |
          image="$(sha256sum < "$RUNNER_TEMP/image-arm64/gophenberg")"
          archived="$(sha256sum < dist/linux_arm64/gophenberg)"
          if [ "$image" != "$archived" ]; then
            echo "the linux/arm64 image holds another binary than the signed archive" >&2
            exit 1
          fi

  publish:
    if: github.event_name == 'push'
    needs: [attest, image-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed
          path: dist
      - name: Upload the signed files to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = false ]; then
            echo "the release $GITHUB_REF_NAME is published already, and a published release never changes" >&2
            exit 1
          fi
          if [ -z "$draft" ]; then
            flags=(--draft --verify-tag --title "Gophenberg ${GITHUB_REF_NAME#v}" --notes "")
            case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
            newest="$( {
              printf '%s\n' "$GITHUB_REF_NAME"
              gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName'
            } | grep -v -- - | sort -V | tail -n 1)"
            if [ "$GITHUB_REF_NAME" != "$newest" ]; then
              flags+=(--latest=false)
            fi
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          gh release upload --clobber "$GITHUB_REF_NAME" dist/*

  image:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build releasetool from the standard library alone
        run: |
          GOMODCACHE="$RUNNER_TEMP/empty-module-cache" GOPROXY=off GOFLAGS=-mod=readonly GOWORK=off \
            go build -o "$RUNNER_TEMP/releasetool" ./cmd/releasetool
      - name: Download the release's own files and check them
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEY_MULTIKEY: ${{ vars.RELEASE_KEY_MULTIKEY }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir dist
          cd dist
          sha256sum -c SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          "$RUNNER_TEMP/releasetool" verify -public "$RELEASE_KEY_MULTIKEY" SHA256SUMS \
            "gophenberg_${version}_linux_amd64.tar.gz" "gophenberg_${version}_linux_arm64.tar.gz"
          for arch in amd64 arm64; do
            mkdir -p "linux_$arch"
            tar -xzf "gophenberg_${version}_linux_$arch.tar.gz" -C "linux_$arch" gophenberg
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/gopherium/gophenberg
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          build-contexts: binaries=./dist
          platforms: linux/amd64
          load: true
          push: false
          tags: gophenberg:publish-check
      - name: The image answers as this official release
        run: |
          about="$(docker run --rm gophenberg:publish-check about -json)"
          if [ "$(printf '%s' "$about" | jq -r .version)" != "${GITHUB_REF_NAME#v}" ] ||
            [ "$(printf '%s' "$about" | jq -r .stamp)" != official ]; then
            echo "the image answers $about" >&2
            exit 1
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          build-contexts: binaries=./dist
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  latest:
    if: github.event_name == 'release'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the newest published stable release whose image is pushed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName --jq '.[].tagName' | grep -v -- - | sort -V | tail -n 1)"
          if [ -z "$newest" ]; then
            echo "no stable release is published, so latest stays where it is"
            exit 0
          fi
          image="ghcr.io/gopherium/gophenberg:${newest#v}"
          if ! docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            echo "$image is not pushed yet, and its own run points latest at it"
            exit 0
          fi
          docker buildx imagetools create -t ghcr.io/gopherium/gophenberg:latest "$image"
