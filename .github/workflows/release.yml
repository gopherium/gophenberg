name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the embedded version matches the tag
        run: |
          embedded="$(cat internal/version/VERSION)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$embedded" != "$tagged" ]; then
            echo "internal/version/VERSION is $embedded but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: make release-archives RELEASE_STAMP=official RELEASE_COMMIT="$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  sign:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build releasetool from the standard library alone
        run: |
          GOMODCACHE="$RUNNER_TEMP/empty-module-cache" GOPROXY=off GOFLAGS=-mod=readonly GOWORK=off \
            go build -o "$RUNNER_TEMP/releasetool" ./cmd/releasetool
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: dist
      - name: Sign the archives, write the record and SHA256SUMS, and check every signature
        env:
          RELEASE_SIGNING_ROLE: ${{ vars.RELEASE_SIGNING_ROLE }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_STANDBY_KEY: ${{ secrets.RELEASE_STANDBY_KEY }}
          RELEASE_KEY_MULTIKEY: ${{ vars.RELEASE_KEY_MULTIKEY }}
          RELEASE_STANDBY_MULTIKEY: ${{ vars.RELEASE_STANDBY_MULTIKEY }}
        run: |
          case "$RELEASE_SIGNING_ROLE" in
            release)
              key_name=RELEASE_SIGNING_KEY
              multikey_name=RELEASE_KEY_MULTIKEY
              ;;
            standby)
              key_name=RELEASE_STANDBY_KEY
              multikey_name=RELEASE_STANDBY_MULTIKEY
              ;;
            *)
              echo "refused RELEASE_SIGNING_ROLE \"$RELEASE_SIGNING_ROLE\", which names neither release nor standby" >&2
              exit 1
              ;;
          esac
          missing=()
          for name in "$key_name" "$multikey_name"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf -v list '%s, ' "${missing[@]}"
            echo "the release environment or the repository holds no ${list%, }" >&2
            exit 1
          fi
          multikey="${!multikey_name}"
          version="${GITHUB_REF_NAME#v}"
          record="gophenberg_${version}_release-record.json"
          tool="$RUNNER_TEMP/releasetool"
          key="$RUNNER_TEMP/release.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "${!key_name}" > "$key")
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release.pub.pem"
          cd dist
          "$tool" sign -key "$key" gophenberg_*.tar.gz
          "$tool" record -version "$version" \
            -download-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            gophenberg_*.tar.gz > "$record"
          "$tool" sign -key "$key" "$record"
          "$tool" sums gophenberg_*.tar.gz "$record" > SHA256SUMS
          "$tool" sign -key "$key" SHA256SUMS
          "$tool" verify -public "$multikey" gophenberg_*.tar.gz "$record" SHA256SUMS
      - name: Check every archive with OpenSSL alone
        working-directory: dist
        run: |
          for archive in gophenberg_*.tar.gz; do
            printf '%s==' "$(tr '_-' '/+' < "$archive.sig" | tr -d '\n')" | openssl base64 -d -A > "$RUNNER_TEMP/sig.bin"
            openssl dgst -sha384 -binary "$archive" > "$RUNNER_TEMP/digest.bin"
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release.pub.pem" -rawin \
              -in "$RUNNER_TEMP/digest.bin" -sigfile "$RUNNER_TEMP/sig.bin"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attest:
    if: github.event_name == 'push'
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  image-check:
    if: github.event_name == 'push'
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: Unpack the linux binaries from their signed archives
        run: |
          for arch in amd64 arm64; do
            mkdir -p "dist/linux_$arch"
            tar -xzf "dist/gophenberg_${GITHUB_REF_NAME#v}_linux_$arch.tar.gz" -C "dist/linux_$arch" gophenberg
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          build-contexts: binaries=./dist
          platforms: linux/amd64
          load: true
          push: false
          tags: gophenberg:release-check
      - name: The image answers as this official release and holds the archive's binary
        run: |
          about="$(docker run --rm gophenberg:release-check about -json)"
          if [ "$(printf '%s' "$about" | jq -r .version)" != "${GITHUB_REF_NAME#v}" ] ||
            [ "$(printf '%s' "$about" | jq -r .stamp)" != official ]; then
            echo "the image answers $about" >&2
            exit 1
          fi
          container="$(docker create gophenberg:release-check)"
          docker cp "$container:/gophenberg" "$RUNNER_TEMP/image-binary"
          docker rm "$container"
          image="$(sha256sum < "$RUNNER_TEMP/image-binary")"
          archived="$(sha256sum < dist/linux_amd64/gophenberg)"
          if [ "$image" != "$archived" ]; then
            echo "the image holds another binary than the signed archive" >&2
            exit 1
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          build-contexts: binaries=./dist
          platforms: linux/arm64
          push: false
          outputs: type=local,dest=${{ runner.temp }}/image-arm64
      - name: The linux/arm64 image holds the signed archive's binary
        run: |
          image="$(sha256sum < "$RUNNER_TEMP/image-arm64/gophenberg")"
          archived="$(sha256sum < dist/linux_arm64/gophenberg)"
          if [ "$image" != "$archived" ]; then
            echo "the linux/arm64 image holds another binary than the signed archive" >&2
            exit 1
          fi

  publish:
    if: github.event_name == 'push'
    needs: [attest, image-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: Upload the signed files to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = false ]; then
            echo "the release $GITHUB_REF_NAME is published already, and a published release never changes" >&2
            exit 1
          fi
          if [ "$draft" = true ]; then
            author="$(gh release view "$GITHUB_REF_NAME" --json author --jq .author.login)"
            if [ "$author" != "github-actions[bot]" ]; then
              echo "the draft $GITHUB_REF_NAME was made by $author and not by this workflow" >&2
              exit 1
            fi
          fi
          if [ -z "$draft" ]; then
            flags=(--draft --verify-tag --title "Gophenberg ${GITHUB_REF_NAME#v}" --notes "")
            case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
            newest="$( {
              printf '%s\n' "$GITHUB_REF_NAME"
              gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName'
            } | grep -v -- - | sort -V | tail -n 1)"
            if [ "$GITHUB_REF_NAME" != "$newest" ]; then
              flags+=(--latest=false)
            fi
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          gh release upload --clobber "$GITHUB_REF_NAME" dist/*
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt"
          while read -r name; do
            if [ ! -f "dist/$name" ]; then
              echo "the draft $GITHUB_REF_NAME holds $name, which this run did not upload" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/assets.txt"

  image:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build releasetool from the standard library alone
        run: |
          GOMODCACHE="$RUNNER_TEMP/empty-module-cache" GOPROXY=off GOFLAGS=-mod=readonly GOWORK=off \
            go build -o "$RUNNER_TEMP/releasetool" ./cmd/releasetool
      - name: Download the release's own files and check them
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_ROLE: ${{ vars.RELEASE_SIGNING_ROLE }}
          RELEASE_KEY_MULTIKEY: ${{ vars.RELEASE_KEY_MULTIKEY }}
          RELEASE_STANDBY_MULTIKEY: ${{ vars.RELEASE_STANDBY_MULTIKEY }}
        run: |
          case "$RELEASE_SIGNING_ROLE" in
            release) multikey_name=RELEASE_KEY_MULTIKEY ;;
            standby) multikey_name=RELEASE_STANDBY_MULTIKEY ;;
            *)
              echo "refused RELEASE_SIGNING_ROLE \"$RELEASE_SIGNING_ROLE\", which names neither release nor standby" >&2
              exit 1
              ;;
          esac
          multikey="${!multikey_name}"
          if [ -z "$multikey" ]; then
            echo "the repository holds no $multikey_name" >&2
            exit 1
          fi
          author="$(gh release view "$GITHUB_REF_NAME" --json author --jq .author.login)"
          if [ "$author" != "github-actions[bot]" ]; then
            echo "the release $GITHUB_REF_NAME was made by $author and not by this workflow" >&2
            exit 1
          fi
          gh release download "$GITHUB_REF_NAME" --dir dist
          cd dist
          sha256sum -c SHA256SUMS
          for file in *; do
            name="${file%.sig}"
            if [ "$name" != SHA256SUMS ] && [ -z "$(awk -v n="$name" '$2 == n' SHA256SUMS)" ]; then
              echo "the release $GITHUB_REF_NAME holds $file, which SHA256SUMS does not list" >&2
              exit 1
            fi
          done
          version="${GITHUB_REF_NAME#v}"
          "$RUNNER_TEMP/releasetool" verify -public "$multikey" SHA256SUMS \
            "gophenberg_${version}_linux_amd64.tar.gz" "gophenberg_${version}_linux_arm64.tar.gz"
          for arch in amd64 arm64; do
            mkdir -p "linux_$arch"
            tar -xzf "gophenberg_${version}_linux_$arch.tar.gz" -C "linux_$arch" gophenberg
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/gopherium/gophenberg
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          build-contexts: binaries=./dist
          platforms: linux/amd64
          load: true
          push: false
          tags: gophenberg:publish-check
      - name: The image answers as this official release
        run: |
          about="$(docker run --rm gophenberg:publish-check about -json)"
          if [ "$(printf '%s' "$about" | jq -r .version)" != "${GITHUB_REF_NAME#v}" ] ||
            [ "$(printf '%s' "$about" | jq -r .stamp)" != official ]; then
            echo "the image answers $about" >&2
            exit 1
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          build-contexts: binaries=./dist
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  latest:
    if: github.event_name == 'release'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the newest stable version tag whose image is pushed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate --jq '.[].ref' \
            | sed 's|^refs/tags/||' | grep -v -- - | sort -V | tail -n 1)"
          if [ -z "$newest" ]; then
            echo "no stable version tag exists, so latest stays where it is"
            exit 0
          fi
          image="ghcr.io/gopherium/gophenberg:${newest#v}"
          if ! docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            echo "$image is not pushed yet, and its own run points latest at it"
            exit 0
          fi
          docker buildx imagetools create -t ghcr.io/gopherium/gophenberg:latest "$image"

  index:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    outputs:
      first: ${{ steps.offer.outputs.first }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build releasetool from the standard library alone
        run: |
          GOMODCACHE="$RUNNER_TEMP/empty-module-cache" GOPROXY=off GOFLAGS=-mod=readonly GOWORK=off \
            go build -o "$RUNNER_TEMP/releasetool" ./cmd/releasetool
      - name: Download the release record and the linux/amd64 archive, and check their signatures
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_ROLE: ${{ vars.RELEASE_SIGNING_ROLE }}
          RELEASE_KEY_MULTIKEY: ${{ vars.RELEASE_KEY_MULTIKEY }}
          RELEASE_STANDBY_MULTIKEY: ${{ vars.RELEASE_STANDBY_MULTIKEY }}
        run: |
          case "$RELEASE_SIGNING_ROLE" in
            release) multikey_name=RELEASE_KEY_MULTIKEY ;;
            standby) multikey_name=RELEASE_STANDBY_MULTIKEY ;;
            *)
              echo "refused RELEASE_SIGNING_ROLE \"$RELEASE_SIGNING_ROLE\", which names neither release nor standby" >&2
              exit 1
              ;;
          esac
          multikey="${!multikey_name}"
          if [ -z "$multikey" ]; then
            echo "the repository holds no $multikey_name" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --dir dist \
            --pattern "gophenberg_${version}_release-record.json*" --pattern "gophenberg_${version}_linux_amd64.tar.gz*"
          cd dist
          "$RUNNER_TEMP/releasetool" verify -public "$multikey" \
            "gophenberg_${version}_release-record.json" "gophenberg_${version}_linux_amd64.tar.gz"
          tar -xzf "gophenberg_${version}_linux_amd64.tar.gz" release.json
      - name: Ask the update site's app for a token that writes to the update site alone
        id: updates
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPDATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATES_APP_PRIVATE_KEY }}
          owner: gopherium
          repositories: gophenberg-updates
          permission-contents: write
      - name: Offer the release on the stable channel of the update site
        id: offer
        env:
          RELEASE_SIGNING_ROLE: ${{ vars.RELEASE_SIGNING_ROLE }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_STANDBY_KEY: ${{ secrets.RELEASE_STANDBY_KEY }}
          RELEASE_KEY_MULTIKEY: ${{ vars.RELEASE_KEY_MULTIKEY }}
          RELEASE_STANDBY_MULTIKEY: ${{ vars.RELEASE_STANDBY_MULTIKEY }}
          TIMESTAMP_KEY_MULTIKEY: ${{ vars.TIMESTAMP_KEY_MULTIKEY }}
          UPDATE_INDEX_VALID: ${{ vars.UPDATE_INDEX_VALID }}
          UPDATES_TOKEN: ${{ steps.updates.outputs.token }}
        run: |
          case "$RELEASE_SIGNING_ROLE" in
            release)
              key_name=RELEASE_SIGNING_KEY
              multikey_name=RELEASE_KEY_MULTIKEY
              ;;
            standby)
              key_name=RELEASE_STANDBY_KEY
              multikey_name=RELEASE_STANDBY_MULTIKEY
              ;;
            *)
              echo "refused RELEASE_SIGNING_ROLE \"$RELEASE_SIGNING_ROLE\", which names neither release nor standby" >&2
              exit 1
              ;;
          esac
          missing=()
          for name in "$key_name" RELEASE_KEY_MULTIKEY RELEASE_STANDBY_MULTIKEY TIMESTAMP_KEY_MULTIKEY UPDATE_INDEX_VALID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf -v list '%s, ' "${missing[@]}"
            echo "the release environment or the repository holds no ${list%, }" >&2
            exit 1
          fi
          multikey="${!multikey_name}"
          version="${GITHUB_REF_NAME#v}"
          tool="$RUNNER_TEMP/releasetool"
          key="$RUNNER_TEMP/release.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "${!key_name}" > "$key")
          helper='!f() { echo username=x-access-token; echo "password=$UPDATES_TOKEN"; }; f'
          for attempt in 1 2 3; do
            rm -rf updates
            git clone -q --depth 1 https://github.com/gopherium/gophenberg-updates.git updates
            index=updates/v1/core/stable.json
            first=false
            if [ ! -f "$index" ]; then
              first=true
            fi
            "$tool" index -site updates -release "$RELEASE_KEY_MULTIKEY" -standby "$RELEASE_STANDBY_MULTIKEY" \
              -timestamp "$TIMESTAMP_KEY_MULTIKEY" -channel stable -record "dist/gophenberg_${version}_release-record.json" \
              -release-json dist/release.json -valid "$UPDATE_INDEX_VALID" > "$RUNNER_TEMP/stable.json"
            mkdir -p updates/v1/core
            mv "$RUNNER_TEMP/stable.json" "$index"
            rm -f "$index.sig"
            "$tool" sign -key "$key" "$index"
            "$tool" verify -public "$multikey" "$index"
            git -C updates add v1/core
            git -C updates -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore(index): offer ${version} on stable"
            if git -C updates -c credential.helper= -c credential.helper="$helper" push -q origin HEAD:main; then
              echo "first=$first" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt $attempt could not push, so the index is written again over the newer one" >&2
          done
          exit 1

  timestamp:
    needs: index
    if: needs.index.outputs.first == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the timestamp workflow for the channel's first index
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run timestamp.yml --ref main -R "$GITHUB_REPOSITORY"
