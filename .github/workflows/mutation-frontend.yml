name: mutation-frontend

on:
  pull_request:
    paths:
      - frontend/**
      - sdk/frontend/**
      - plugins/*/frontend/**
      - .github/workflows/mutation-frontend.yml

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: node scripts/mutate-changed.ts "$BASE" count >> "$GITHUB_OUTPUT"
        env:
          BASE: origin/${{ github.base_ref }}
          MUTANTS_PER_SHARD: 45
          MAX_SHARDS: 20

  stryker:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run mutate:changed "$BASE" "$SHARD"
        env:
          BASE: origin/${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stryker-report-${{ matrix.shard }}
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore
