version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
      semver-major-days: 30
      semver-minor-days: 7
    groups:
      frontend:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@wordpress/*"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
      semver-major-days: 30
      semver-minor-days: 7
    groups:
      docs:
        patterns:
          - "*"
