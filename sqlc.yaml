version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/postgres/queries.sql"
    schema: "internal/postgres/migrations"
    gen:
      go:
        package: "db"
        out: "internal/postgres/db"
        sql_package: "pgx/v5"
        rename:
          core_medium: "CoreMedia"
        overrides:
          - column: "core.media.sizes"
            go_type:
              import: "github.com/gopherium/gophenberg/internal/media"
              type: "RenditionMap"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
